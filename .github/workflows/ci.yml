---
# No paths-ignore for docs-only changes: clitest_docs_match_verbs asserts that docs/*.md, the
# README links and the commandTypes array in Program.cs stay in step, so a docs-only commit is
# exactly the commit that test exists to catch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A called workflow can never exceed the caller's grant, so this caps test.yml too.
permissions:
  contents: read

# Never cancel a run on main: it populates the shared NuGet cache every PR restores from, and
# it is what gates releases.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The check-run name is "<caller job id> / <called job name>", i.e. "test / build-and-test".
  # Renaming this job id or build-and-test in test.yml silently orphans any required status
  # check on main, which then blocks every PR waiting on a check that no longer reports.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    with:
      # Not left at the default of false: this keeps the artifact path the publish workflow
      # will depend on exercised on every run.
      upload-binary: true
      artifact-name: kcksefcli-linux-x64
      retention-days: 7
