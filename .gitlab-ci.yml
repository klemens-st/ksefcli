---

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  interruptible: true
  timeout: 5min
  # tags: [nomad]

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

stages:
  - build
  - test
  - release

secret_detection:
  stage: build

.format_check:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - dotnet format src/KCKSeFCli -v d --include "$(find src -name *.cs | paste -sd,)" --verify-no-changes

.build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  cache:
    key: "nuget-packages"
    paths:
      - .nuget/packages

.release_main_expire_never:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    expire_in: never

linux_build_and_unit_test:
  extends: .build
  script:
    # C# unit and regression tests. Runs before publish so a failure fails fast.
    - dotnet test tests/KCKSeFCli.Tests/KCKSeFCli.Tests.csproj -c Release
    - dotnet publish src/KCKSeFCli/KCKSeFCli.csproj -c Release -r linux-x64 -f net10.0 -o dist
    - mv -v ./dist/kcksefcli .
    - ldd ./kcksefcli
    - stat ./kcksefcli
    # Black-box CLI tests against the published binary.
    - time ./tests/unit.sh ./kcksefcli
  artifacts:
    paths:
      - ./kcksefcli
    expire_in: 1 week

integration_tests:
  stage: test
  image: cgr.dev/chainguard/wolfi-base
  needs: [linux_build_and_unit_test]
  script:
    - ./tests/setup-wolfie.sh
    - ./kcksefcli --help
    - time ./tests/unit.sh ./kcksefcli
    - time ./tests/ci.sh ./kcksefcli
  environment:
    name: integration_tests

linux_build_main:
  extends: .release_main_expire_never
  script:
    - echo "Publishing linux binary from previous stages"
  artifacts:
    paths:
      - ./kcksefcli

windows_build_main:
  extends: [.release_main_expire_never, .build]
  dependencies: []
  script:
    - dotnet publish src/KCKSeFCli/KCKSeFCli.csproj -c Release -r win-x64 -f net10.0 -o dist
    - mv -v dist/kcksefcli.exe .
    - stat ./kcksefcli.exe
  artifacts:
    paths:
      - ./kcksefcli.exe

win-x86-net6.0_build_main:
  extends: [.release_main_expire_never, .build]
  dependencies: []
  script:
    - dotnet publish src/KCKSeFCli/KCKSeFCli.csproj -c Release -r win-x86 -f net6.0 -o dist
    - mv -v dist/kcksefcli.exe .
    - stat ./kcksefcli.exe
  artifacts:
    paths:
      - ./kcksefcli.exe
